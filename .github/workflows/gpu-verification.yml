name: GPU verification

# Regression gate for the CUDA pipeline's correctness argument: the Lean proofs
# of its models, and the CBMC queries, source audits, source pins and
# sanitizer harnesses that tie src/gpu to them. No GPU is needed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: GPU proofs (Lean)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned elan bootstrap
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/elan-v4.2.0"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.0/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$install_dir/elan.tar.gz"
          echo "620db834935d0da55ac9cda207b2e370e8034061cbb0228af5eb6c14b02f0c0c  $install_dir/elan.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$install_dir/elan.tar.gz" -C "$install_dir"
          "$install_dir/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore pinned dependency cache only
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: proofs/.lake/packages
          key: proof-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}

      - name: Restore Mathlib artifacts for the locked dependencies
        working-directory: proofs
        run: lake exe cache get

      - name: Lean proofs, source pins and axiom audits
        run: ./scripts/test-gpu-correctness.sh proofs

  source:
    name: GPU source checks (CBMC, audits, harnesses)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: CBMC queries, source audits and sanitizer harnesses
        run: nix develop -i --keep HOME .#gpu-verify -c ./scripts/test-gpu-correctness.sh source
